display_information:
  name: T3 Code
  description: Start T3 Code threads from Slack
features:
  bot_user:
    display_name: t3
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - reactions:write
      - channels:history
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
